[build-system]
requires = ["uv_build>=0.7.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cna"
version = "0.5.4"
authors = [
    { name = "Yakir Reshef", email = "yreshef@broadinstitute.org" },
    { name = "Laurie Rumker", email = "lrumker@broadinstitute.org" }
]
description = "covarying neighborhood analysis"
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.11",
    "numpy>=2.2,<2.5.0",
    "pandas>=2.3",
    "scipy>=1.15",
    "argparse>=1.1",
    "matplotlib>=3.1.3",
    "scanpy>=1.10",
    "numba>=0.65.1",
]

[project.urls]
repository = "https://github.com/immunogenomics/cna"
issues = "https://github.com/immunogenomics/cna/issues"
documentation = "https://github.com/immunogenomics/cna/blob/master/demo/demo.ipynb"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.43",
]
